name: Live ingestion (manual)

# Runs the polite brewing-methods scraper from a GitHub-hosted runner (which has internet) and
# publishes the raw CSVs, the run log and a row-count summary as a workflow artifact. This is the
# evidence that the live fetch works; it is NOT part of the normal CI and does not change
# committed data.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-ingestion.txt
      - name: Fetch (robots.txt checked, 2 s between requests)
        run: |
          mkdir -p data/raw
          python -m ingestion.brewing_methods -v 2>&1 | tee data/raw/run.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Live brewing-methods ingestion"
            echo "- Run at: $(date -u +%FT%TZ)"
            for f in data/raw/brewing_*.csv; do
              [ -f "$f" ] && echo "- $(basename $f): $(($(wc -l < $f) - 1)) rows"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brewing-live-ingestion
          path: data/raw/
