name: Live ingestion (manual)

# Runs the polite brewing-methods scraper from a GitHub-hosted runner (which has internet) and
# publishes the raw CSVs, the run log and a row-count summary as a workflow artifact. This is the
# evidence that the live fetch works; it is NOT part of the normal CI and does not change
# committed data.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-ingestion.txt
      - name: Fetch (robots.txt checked, 2 s between requests)
        run: |
          mkdir -p data/raw
          python -m ingestion.brewing_methods -v 2>&1 | tee data/raw/run.log
      - name: Write docs/LIVE_RUN.md
        if: always()
        run: |
          {
            echo "# Last live ingestion run (brewing methods)"
            echo
            echo "Written by the workflow \`live-ingestion.yml\` on a GitHub-hosted runner. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "- Run at (UTC): $(date -u +%FT%TZ)"
            for f in data/raw/brewing_*.csv; do
              [ -f "$f" ] && echo "- \`$f\`: $(($(wc -l < "$f") - 1)) rows"
            done
            echo
            echo "## First rows"
            for f in data/raw/brewing_*.csv; do
              [ -f "$f" ] && { echo; echo "\`$f\`"; echo '```'; head -6 "$f" | cut -c1-240; echo '```'; }
            done
            echo
            echo "## Run log (tail)"
            echo '```'; tail -25 data/raw/run.log | cut -c1-240; echo '```'
          } > docs/LIVE_RUN.md
          cat docs/LIVE_RUN.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit LIVE_RUN.md
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LIVE_RUN.md
          git commit -m "Record last live ingestion run" || exit 0
          git pull --rebase -q && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brewing-live-ingestion
          path: data/raw/
