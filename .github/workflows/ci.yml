name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: "Ingestion tests (offline: parsers on hand-written fixtures, robots/rate-limit/retry with mocked HTTP)"
        run: |
          python -m pytest -q tests/test_ingestion_*.py
          python -m ingestion.brewing_methods --help > /dev/null
      - name: Run tests (dataset, pipeline, SQL queries)
        run: python -m pytest -q
      - name: Run the ETL pipeline and analysis queries end to end
        run: |
          python -m pipeline
          python -m pipeline.docgen
          python sql/run_queries.py
      - name: Generated docs and query results must be committed and current
        run: git diff --exit-code -- docs
